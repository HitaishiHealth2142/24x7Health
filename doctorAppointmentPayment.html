<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Appointment Payment</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      color: #1a1a1a;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    h2 i {
      color: #667eea;
      font-size: 32px;
    }

    .details-box {
      background: linear-gradient(135deg, #f8faff 0%, #f0f5ff 100%);
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border: 1px solid rgba(102, 126, 234, 0.2);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
    }

    .details-box h3 {
      font-size: 22px;
      color: #2d3748;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .details-box p {
      color: #4a5568;
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-box p strong {
      color: #2d3748;
      font-weight: 600;
      min-width: 120px;
    }

    .amount-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 25px;
      border-radius: 16px;
      margin-top: 25px;
      color: white;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .amount-box p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 10px;
      font-size: 16px;
    }

    .amount-box p:last-of-type {
      margin-bottom: 15px;
    }

    .amount-box h3 {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      border-top: 2px solid rgba(255, 255, 255, 0.3);
      padding-top: 15px;
    }

    .payment-methods {
      margin: 25px 0;
    }

    .payment-methods h3 {
      color: #2d3748;
      margin-bottom: 15px;
    }

    .pay-btn {
      width: 100%;
      padding: 18px;
      border: none;
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(72, 187, 120, 0.3);
    }

    .pay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(72, 187, 120, 0.4);
    }

    .pay-btn:active {
      transform: translateY(0);
    }

    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .pay-btn i {
      font-size: 20px;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      display: none;
    }

    .success-message {
      background: #c6f6d5;
      color: #22543d;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      display: none;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 15px;
      }

      .container {
        padding: 25px;
      }

      h2 {
        font-size: 24px;
      }

      .details-box p strong {
        min-width: 100px;
      }

      .amount-box h3 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2><i class="fas fa-credit-card"></i> Complete Your Payment</h2>

    <div class="details-box" id="appointmentDetails"></div>

    <div class="payment-methods">
      <h3><i class="fas fa-shield-alt"></i> Secure Payment via Razorpay</h3>
      <p style="color: #718096; margin-bottom: 20px;">
        <i class="fas fa-lock"></i> Your payment is secure and encrypted
      </p>
    </div>

    <button class="pay-btn" onclick="makePayment()" id="payBtn">
      <i class="fas fa-rupee-sign"></i> Pay Now
    </button>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
  </div>

  <script>
    let appointmentData = null;
    let appointmentId = null;

    document.addEventListener("DOMContentLoaded", async function () {
      const data = sessionStorage.getItem("appointmentPaymentData");

      if (!data) {
        showError("No appointment found. Please book an appointment first.");
        setTimeout(() => {
          window.location.href = "doctors.html";
        }, 2000);
        return;
      }

      appointmentData = JSON.parse(data);
      appointmentId = appointmentData.appointmentId;

      // Fetch fresh appointment details from server
      await fetchAppointmentDetails();

      displayAppointmentDetails();
    });

    async function fetchAppointmentDetails() {
      try {
        const response = await fetch(`/api/appointment-payment-details/${appointmentId}`);
        const result = await response.json();

        if (result.success) {
          appointmentData = {
            ...appointmentData,
            ...result.appointment
          };
        }
      } catch (error) {
        console.error("Error fetching appointment details:", error);
      }
    }

    function displayAppointmentDetails() {
      const finalAmount = appointmentData.finalAmount || appointmentData.final_amount || 350;
      const originalFee = appointmentData.consultationFee || appointmentData.original_fee || 500;
      const discount = appointmentData.discount || (originalFee - finalAmount);

      document.getElementById("appointmentDetails").innerHTML = `
        <h3>Dr. ${appointmentData.doctorName || appointmentData.doctor_name || ""}</h3>
        <p><strong>Specialization:</strong> ${appointmentData.specialization || appointmentData.doctor_specialization || "General Physician"}</p>
        <p><strong>Date:</strong> ${appointmentData.appointmentDate || appointmentData.appointment_date}</p>
        <p><strong>Time:</strong> ${appointmentData.appointmentTime || appointmentData.appointment_time}</p>
        <p><strong>Patient Name:</strong> ${appointmentData.patientName || appointmentData.patient_name}</p>
        <div class="amount-box">
          <p>Consultation Fee: ₹${originalFee}</p>
          <p>Discount (30%): -₹${discount}</p>
          <h3>Final Amount: ₹${finalAmount}</h3>
        </div>
      `;
    }

    async function makePayment() {
      const payBtn = document.getElementById('payBtn');
      const finalAmount = appointmentData.finalAmount || appointmentData.final_amount || 350;

      // Disable button and show loading
      payBtn.disabled = true;
      payBtn.innerHTML = '<span class="loading-spinner"></span> Creating Order...';

      try {
        // 1. Create Razorpay Order
        const orderResponse = await fetch('/api/create-razorpay-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appointmentId: appointmentId,
            amount: finalAmount
          })
        });

        const orderData = await orderResponse.json();

        if (!orderData.success) {
          throw new Error(orderData.message || 'Failed to create payment order');
        }

        // 2. Configure Razorpay Options
        const options = {
          key: orderData.keyId,
          amount: orderData.amount,
          currency: orderData.currency,
          name: "24x7 Health Services",
          description: `Appointment with Dr. ${appointmentData.doctorName || appointmentData.doctor_name}`,
          order_id: orderData.orderId,
          handler: function (response) {
            verifyPayment(response);
          },
          prefill: {
            name: appointmentData.patientName || appointmentData.patient_name,
            email: appointmentData.patientEmail,
            contact: appointmentData.patientMobile
          },
          theme: {
            color: "#667eea"
          },
          modal: {
            ondismiss: function() {
              payBtn.disabled = false;
              payBtn.innerHTML = '<i class="fas fa-rupee-sign"></i> Pay Now';
            }
          }
        };

        // 3. Open Razorpay Checkout
        const razorpay = new Razorpay(options);
        razorpay.open();

      } catch (error) {
        console.error("Payment error:", error);
        showError(error.message || "Failed to initiate payment. Please try again.");
        payBtn.disabled = false;
        payBtn.innerHTML = '<i class="fas fa-rupee-sign"></i> Pay Now';
      }
    }

    async function verifyPayment(paymentResponse) {
      const payBtn = document.getElementById('payBtn');
      payBtn.innerHTML = '<span class="loading-spinner"></span> Verifying Payment...';

      try {
        const verifyResponse = await fetch('/api/verify-razorpay-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            razorpay_order_id: paymentResponse.razorpay_order_id,
            razorpay_payment_id: paymentResponse.razorpay_payment_id,
            razorpay_signature: paymentResponse.razorpay_signature,
            appointmentId: appointmentId
          })
        });

        const result = await verifyResponse.json();

        if (result.success) {
          showSuccess("Payment Successful! Appointment Confirmed.");
          
          // Clear session storage
          sessionStorage.removeItem("appointmentPaymentData");
          
          // Redirect based on flow type
          setTimeout(() => {
            if (appointmentData.flowType === "instant") {
              const roomId = "apt_" + appointmentId;
              window.location.href = `meet.html?roomId=${roomId}&doctorUid=${appointmentData.doctorUid}`;
            } else {
              window.location.href = "patientProfile.html";
            }
          }, 2000);
        } else {
          throw new Error(result.message || "Payment verification failed");
        }
      } catch (error) {
        console.error("Verification error:", error);
        showError(error.message || "Payment verification failed. Please contact support.");
        payBtn.disabled = false;
        payBtn.innerHTML = '<i class="fas fa-rupee-sign"></i> Pay Now';
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.style.display = 'block';
    }
  </script>
</body>
</html>
